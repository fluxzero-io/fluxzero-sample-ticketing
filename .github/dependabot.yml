version: 2
registries:
  fluxzero-packages:
    type: maven-repository
    url: https://packages.fluxzero.io/maven
updates:
  - package-ecosystem: maven
    registries: [fluxzero-packages]
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      fluxzero-sdk:
        patterns: ["io.fluxzero:*"]
        update-types: [minor, patch]
      maven-non-major:
        patterns: ["*"]
        exclude-patterns: ["io.fluxzero:*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      vite-toolchain:
        patterns: ["vite", "@vitejs/plugin-react"]
      npm-non-major:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    groups:
      actions-non-major:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
